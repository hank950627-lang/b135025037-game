<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽車繞圈道具賽 V3 - Tech Lead Engineered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        canvas { border: 4px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div class="mb-4 text-center">
        <h1 class="text-3xl font-bold tracking-wider text-indigo-400">🏎️ 賽車道具賽 (V3)</h1>
        <p class="text-sm text-slate-400 mt-1">方向鍵/WASD 控制方向與加速 | FPS 獨立 & dt 計時器架構</p>
    </div>

    <div class="relative">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="hud" class="absolute top-4 left-4 bg-slate-900/80 p-3 rounded-lg border border-slate-700 text-xs font-mono space-y-1">
            <div>速度: <span id="speedVal" class="text-emerald-400">0</span> px/s</div>
            <div>加速狀態: <span id="boostVal" class="text-slate-400">無</span></div>
            <div>下一道具: <span id="timerVal" class="text-yellow-400">2.0</span>s</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI 元素
        const speedVal = document.getElementById('speedVal');
        const boostVal = document.getElementById('boostVal');
        const timerVal = document.getElementById('timerVal');

        // 按鍵狀態
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // 賽車狀態 (以秒為單位的物理數值)
        const car = {
            x: 400,
            y: 500,
            angle: 0,
            speed: 0,
            maxSpeed: 250,      // 像素/秒
            accel: 180,         // 加速度 (像素/秒²)
            friction: 0.96,     // 阻尼/摩擦
            turnSpeed: 3.0,     // 轉向速度 (弧度/秒)
            boostTimer: 0,
            boostMultiplier: 1.0
        };

        // 道具陣列與計時器 (dt 基礎)
        const items = [];
        let itemSpawnTimer = 0;
        const ITEM_SPAWN_INTERVAL = 2.0; // 每 2 秒生成一個道具

        // 隨機生成道具 (圓形碰撞)
        function spawnItem() {
            if (items.length >= 8) return; // 限制數量避免過多
            
            // 在環形賽道區域內隨機生成
            const angle = Math.random() * Math.PI * 2;
            const radius = 160 + Math.random() * 120; // 賽道半徑範圍
            items.push({
                x: 400 + Math.cos(angle) * radius,
                y: 300 + Math.sin(angle) * radius,
                radius: 12,
                type: Math.random() > 0.4 ? 'BOOST' : 'TRAP'
            });
        }

        // 遊戲更新邏輯 (以 dt 為基礎)
        function update(dt) {
            // 1. 道具生成計時器 (解決背景計時與 FPS 差異問題)
            itemSpawnTimer += dt;
            if (itemSpawnTimer >= ITEM_SPAWN_INTERVAL) {
                spawnItem();
                itemSpawnTimer -= ITEM_SPAWN_INTERVAL;
            }

            // 2. 道具效果遞減
            if (car.boostTimer > 0) {
                car.boostTimer -= dt;
                if (car.boostTimer <= 0) {
                    car.boostMultiplier = 1.0;
                    car.boostTimer = 0;
                }
            }

            // 3. 轉向邏輯
            if (keys['ArrowLeft'] || keys['a']) car.angle -= car.turnSpeed * dt;
            if (keys['ArrowRight'] || keys['d']) car.angle += car.turnSpeed * dt;

            // 4. 加速與前進邏輯
            const effectiveMaxSpeed = car.maxSpeed * car.boostMultiplier;
            if (keys['ArrowUp'] || keys['w']) {
                car.speed += car.accel * dt;
                if (car.speed > effectiveMaxSpeed) car.speed = effectiveMaxSpeed;
            } else if (keys['ArrowDown'] || keys['s']) {
                car.speed -= car.accel * dt;
                if (car.speed < -effectiveMaxSpeed / 2) car.speed = -effectiveMaxSpeed / 2;
            } else {
                car.speed *= Math.pow(car.friction, dt * 60); // 擬平滑摩擦
            }

            // 5. 位置更新
            car.x += Math.cos(car.angle) * car.speed * dt;
            car.y += Math.sin(car.angle) * car.speed * dt;

            // 6. 道具碰撞檢測 ($d < r_1 + r_2$)
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                const dx = car.x - item.x;
                const dy = car.y - item.y;
                const distance = Math.hypot(dx, dy);

                if (distance < 15 + item.radius) { // 15 為車輛判定半徑
                    if (item.type === 'BOOST') {
                        car.boostMultiplier = 1.8;
                        car.boostTimer = 3.0; // 加速 3 秒
                    } else if (item.type === 'TRAP') {
                        car.speed = -50; // 踩到陷阱急停並微退
                    }
                    items.splice(i, 1); // 移除已吃到的道具
                }
            }

            // 更新 HUD
            speedVal.textContent = Math.round(car.speed);
            boostVal.textContent = car.boostTimer > 0 
                ? (car.boostMultiplier > 1 ? `🚀 加速中 (${car.boostTimer.toFixed(1)}s)` : '減速')
                : '正常';
            boostVal.className = car.boostTimer > 0 ? 'text-amber-400 font-bold' : 'text-slate-400';
            timerVal.textContent = (ITEM_SPAWN_INTERVAL - itemSpawnTimer).toFixed(1);
        }

        // 渲染畫面
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫賽道 (環形)
            ctx.beginPath();
            ctx.arc(400, 300, 280, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 120;
            ctx.strokeStyle = '#334155';
            ctx.stroke();

            // 畫賽道內外邊界線
            ctx.beginPath();
            ctx.arc(400, 300, 340, 0, Math.PI * 2);
            ctx.arc(400, 300, 220, 0, Math.PI * 2);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 畫道具
            items.forEach(item => {
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                ctx.fillStyle = item.type === 'BOOST' ? '#38bdf8' : '#ef4444';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            });

            // 畫賽車
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // 車身
            ctx.fillStyle = car.boostTimer > 0 ? '#f59e0b' : '#6366f1';
            ctx.fillRect(-15, -10, 30, 20);
            // 車頭標示
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(5, -6, 8, 12);
            
            ctx.restore();
        }

        // 遊戲主迴圈 (Game Loop with Delta Time)
        let lastTime = performance.now();
        function gameLoop(currentTime) {
            const dt = (currentTime - lastTime) / 1000.0; // 轉換為秒
            lastTime = currentTime;

            // 限制最大 dt (防止切換背景過久再切回時的穿牆爆發)
            const safeDt = Math.min(dt, 0.1);

            update(safeDt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // 初始化遊戲
        requestAnimationFrame(currentTime => {
            lastTime = currentTime;
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
